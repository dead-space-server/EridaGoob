# erida edit

- type: traitCategory
  id: Species
  name: trait-category-species
  priority: 10
  accentColor: "#f97316"

- type: trait
  id: VulpJumpAbility
  name: trait-VulpJumpAbility-name
  description: trait-VulpJumpAbility-desc
  category: Species
  conditions:
  - !type:IsSpeciesCondition
    species: Anthropomorph
  effects:
  - !type:AddCompsEffect
    components:
    - type: JumpAbility
      action: ActionVulpkaninGravityJump
      canCollide: true
      jumpDistance: 3
      jumpSound:
        path: /Audio/Weapons/punchmiss.ogg
        params:
          pitch: 1.33
          volume: -5
          variation: 0.05

- type: trait # erida edit - IPCs can't have biological traits
  id: CatLigaments
  name: trait-catligaments-name
  description: trait-catligaments-desc
  category: Medical
  conditions:
  - !type:IsSpeciesCondition
    species: IPC
    invert: true
  effects:
  - !type:AddCompsEffect
    components:
     - type: Vocal
       sounds:
         Male: MaleFelinid
         Female: FemaleFelinid
         Unsexed: MaleFelinid
     - type: Speech
       allowedEmotes: [ 'Mew', 'Meow', 'Purr', 'Hiss' ]
       speechSounds: Alto

- type: trait # erida edit - IPCs can't have biological traits
  id: dogpLigaments
  name: trait-dogligaments-name
  description: trait-dogligments-desc
  category: Medical
  conditions:
  - !type:IsSpeciesCondition
    species: IPC
    invert: true
  effects:
  - !type:AddCompsEffect
    components:
     - type: MessyDrinker
       spillChance: 0.33
     - type: Speech
       speechSounds: Vulpkanin
       speechVerb: Vulpkanin
       allowedEmotes: [ 'Bark', 'Snarl', 'Whine', 'Howl', 'Growl' ]
     - type: Vocal
       sounds:
         Male: MaleVulpkanin
         Female: FemaleVulpkanin
         Unsexed: MaleVulpkanin

