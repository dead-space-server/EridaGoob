
- type: entity
  parent: [ClothingBeltBase, PowerCellSlotSmallItem, BaseToggleClothing]
  id: ClothingBeltEnergyShield
  name: championship belt
  description: Proves to the world that you are the strongest!
  components:
  - type: Sprite
    sprite: _Erida/Clothing/Belt/champion.rsi
  - type: Clothing
    sprite: _Erida/Clothing/Belt/champion.rsi
  - type: EnergyShield
    energyConsuptionPerDamage: 5
    shield: BaseEnergyShield
    modifiers:
      coefficients:
        Blunt: 1
        Slash: 1
        Piercing: 1
        Heat: 1
  - type: StaticPrice
    price: 500
  - type: PowerCellDraw
    drawRate: 1
  - type: ToggleCellDraw
  - type: ToggleClothing
    action: ActionToggleEnergyShield
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 375
      Plastic: 250
      Silver: 125
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
  - type: Tag
    tags: []

- type: entity
  parent: BaseAction
  id: ActionToggleEnergyShield
  name: Toggle Energy Shield
  description: Toggles the energy shield on and off.
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  id: BaseEnergyShield
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Erida/Effects/shields.rsi
    state: unfathomable_shield
    drawdepth: Effects
    color: blue
    noRot: true
  - type: PointLight
    enabled: true
    radius: 5
    power: 2
    color: "#b00000"
  - type: Tag
    tags:
      - HideContextMenu
