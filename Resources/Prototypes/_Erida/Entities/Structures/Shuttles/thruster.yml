#Thruster
- type: entity
  id: OmniThrusterMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: omni-thruster
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: OmniThruster
    stackRequirements:
      Manipulator: 8
      Steel: 15

- type: entity
  id: OmniThruster
  name: omni-thruster
  parent: [BaseThruster, ConstructibleMachine]
  components:
  - type: Sprite
    sprite: _Erida/Structures/Shuttles/omni_thruster.rsi
    offset: 0,0
    layers:
    - state: base_luatech
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust_luatech
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0,1.5
  - type: Machine
    board: OmniThrusterMachineCircuitboard
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.49,-0.49,1.49,0.49"
        density: 1750
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 3000
  - type: Thruster
    thrust: 1600
    burnShape: ["-0.3,0.5","0.2,1.6","0.8,1.6","1.3,0.5"]
    damage:
      types:
        Heat: 120
  - type: StaticPrice
    price: 1500

