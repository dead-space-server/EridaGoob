#Gyroscope
- type: entity
  id: ELGyroscopeMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: advanced gyroscope
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: ELGyroscope
    stackRequirements:
      Manipulator: 8
      Steel: 5
      Glass: 4

- type: entity
  id: ELGyroscope
  parent: Gyroscope
  name: advanced gyroscope
  components:
  - type: Thruster
    thrusterType: Angular
    requireSpace: false
    thrust: 25000
    machinePartThrust: Manipulator
  - type: ApcPowerReceiver
    powerLoad: 3000
  - type: Sprite
    sprite: _Erida/Structures/Shuttles/advancedgyroscope.rsi
    snapCardinals: true
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn
      map: [ "enum.ThrusterVisualLayers.Thrusting" ]
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
  - type: Machine
    board: ELGyroscopeMachineCircuitboard

- type: entity
  id: SyndicateGyroscopeMachineCircuitboard
  parent: ELGyroscopeMachineCircuitboard
  name: advanced gyroscope Syndicate
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: SyndicateGyroscope

- type: entity
  id: SyndicateGyroscope
  parent: ELGyroscope
  name: advanced gyroscope Syndicate
  components:
  - type: Sprite
    sprite: _Erida/Structures/Shuttles/syndicate_gyroscope.rsi
    snapCardinals: true
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn
      map: [ "enum.ThrusterVisualLayers.Thrusting" ]
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
  - type: Machine
    board: SyndicateGyroscopeMachineCircuitboard

