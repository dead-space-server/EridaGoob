- type: entity
  parent: BaseStructure
  id: MeteorShieldSatellite
  name: meteor shield satellite
  description: A meteor point-defense satellite. Anchor it on a powered grid with a clear view of space.
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: Sprite
    sprite: _Erida/Structures/Machines/meteor_shield.rsi
    noRot: true
    layers:
    - state: sat_inactive
      map: [ "enum.MeteorShieldVisuals.Active" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MeteorShieldVisuals.Active:
        enum.MeteorShieldVisuals.Active:
          True: { state: sat_active }
          False: { state: sat_inactive }
  - type: InteractionOutline
  - type: Anchorable
  - type: ApcPowerReceiver
    powerLoad: 2000
  - type: ExtensionCableReceiver
  - type: MeteorShield
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
  - type: StaticPrice
    price: 500

- type: entity
  id: MeteorShieldBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/_Erida/Effects/techanom_beam.rsi
    drawdepth: Effects
    layers:
    - state: beam
      shader: unshaded
      color: "#ff6a3d"
  - type: Physics
    canCollide: false
  - type: Beam
  - type: TimedDespawn
    lifetime: 0.6
  - type: Tag
    tags:
    - HideContextMenu
