- type: entity
  id: ArmySetLoadouts
  name: army duffel bag with equipment
  description: Here is the equipment you took with you from the base. It remains to remember which ones exactly.
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _Corvax/Back/Duffels/military.rsi
    state: icon
  - type: Item
    size: Normal
  - type: ThiefUndeterminedBackpack
    possibleSets:
    - UTAPMk1Set
  - type: ActivatableUI
    key: enum.ThiefBackpackUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface

- type: thiefBackpackSet
  id: UTAPMk1Set
  name: duffel-category-utapmk1-name
  description: duffel-category-utapmk1-description
  sprite:
    sprite: _Erida/Objects/Weapons/Gunsx64/Rifles/utap-mark1/big.rsi
    state: icon
  content:
  - Flash
  - WeaponRifleUTAPM1
  - MagazineRifle
  - MagazineRifle
  - MagazineRifle
  - TruncheonDT3Zlodey # erida edit

