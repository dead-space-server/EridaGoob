# erida edit
- type: entity
  id: Shower
  name: shower
  description: A shower, complete with bluespace water.
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
    - type: Sprite
      sprite: _Backmen/Structures/Furniture/shower.rsi
      drawdepth: WallMountedItems
      layers:
      - state: shower
    - type: Appearance
    - type: Rotatable
    - type: Transform
      noRot: false
    - type: Clickable
    - type: Physics
      bodyType: Static
      canCollide: false
    - type: InteractionOutline
    - type: Construction
      graph: Shower
      node: shower
    - type: Damageable
      damageModifierSet: StructuralMetallic
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
