- type: species
  id: Reptilian
  name: species-name-reptilian
  roundStart: true
  prototype: MobReptilian
  sprites: MobReptilianSprites
  defaultSkinTone: "#34a223"
  markingLimits: MobReptilianMarkingLimits
  dollPrototype: MobReptilianDummy
  skinColoration: Hues
  maleFirstNames: NamesReptilianMale
  femaleFirstNames: NamesReptilianFemale
  naming: FirstDashFirst

- type: speciesBaseSprites
  id: MobReptilianSprites
  sprites:
    TailBehind: MobHumanoidAnyMarking # floof
    TailOversuit: MobHumanoidAnyMarking # floof
    TailBehindBackpack: MobHumanoidAnyMarking # imp
    Head: MobReptilianHead
    Face: MobHumanoidAnyMarking # Goob?
    Snout: MobHumanoidAnyMarking
    Chest: MobReptilianChest
    Groin: MobReptilianGroin
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobHumanoidEyes
    LArm: MobReptilianLArm
    RArm: MobReptilianRArm
    LHand: MobReptilianLHand
    RHand: MobReptilianRHand
    LLeg: MobReptilianLLegDigi # WWDP-Edit
    RLeg: MobReptilianRLegDigi # WWDP-Edit
    LFoot: MobReptilianLFootDigi # WWDP-Edit
    RFoot: MobReptilianRFootDigi # WWDP-Edit

- type: markingPoints
  id: MobReptilianMarkingLimits
  points:
    Hair:
      points: 10
      required: false
    FacialHair:
      points: 10
      required: false
    Tail:
      points: 10
      required: true
      defaultMarkings: [ LizardTailSmooth ]
    Snout:
      points: 10
      required: true
      defaultMarkings: [ LizardSnoutRound ]
    HeadTop:
      points: 10
      required: false
    HeadSide:
      points: 10 # WWDP-Edit
      required: false
    Chest:
      points: 10
      required: false
    RightLeg:
      points: 10
      required: false
    RightFoot:
      points: 10
      required: false
    LeftLeg:
      points: 10
      required: false
    LeftFoot:
      points: 10
      required: false
    RightArm:
      points: 10
      required: false
    RightHand:
      points: 10
      required: false
    LeftArm:
      points: 10
      required: false
    LeftHand:
      points: 10
      required: false
    Wings: # Goob
      points: 1
      required: false

